<!-- Top Bar / Security Status -->
<div class="flex items-center justify-between px-space-lg py-space-md bg-brand-navy text-text-on-brand">
<button aria-label="Tutup autentikasi" class="w-12 h-12 flex items-center justify-center -ml-2 rounded-full active:bg-white/10 transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
<div class="flex items-center gap-space-xs px-3 py-1 bg-white/10 rounded-full">
<span class="material-symbols-outlined text-[16px] text-signature-gold" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<span class="font-label-sm text-label-sm text-text-on-brand font-medium tracking-wide">Keamanan Dompet</span>
</div>
<div class="w-10"></div>
</div>
<!-- Main Security Header & Info Area -->
<div class="flex flex-col items-center px-space-lg pt-6 pb-4 text-center">
<!-- Security Shield Icon with Brand Glow -->
<div class="relative flex items-center justify-center w-16 h-16 mb-4">
<div class="absolute inset-0 rounded-full bg-brand-primary/20 blur-md scale-110"></div>
<div class="relative flex items-center justify-center w-14 h-14 rounded-full bg-brand-subtle">
<span class="material-symbols-outlined text-[32px] text-brand-primary" style="font-variation-settings: 'FILL' 1;">shield_lock</span>
</div>
</div>
<!-- Title & Payment Description -->
<h1 class="font-headline-lg text-headline-lg text-text-primary mb-2">
      Masukkan PIN 6-Digit
    </h1>
<p class="font-body-md text-body-md text-text-secondary max-w-[320px]">
      Konfirmasi pembayaran belanja sebesar <span class="font-semibold text-text-primary">Rp 18.998.000</span> ke <span class="font-semibold text-text-primary">Apple Official Store</span>
</p>
<!-- 6 Discrete PIN Indicators (Rule #5 Compliant) -->
<div aria-label="Indikator 6 Digit PIN" class="flex items-center justify-center gap-3.5 my-7" id="pin-dots-container">
<!-- Dot 1 Filled -->
<div class="w-3.5 h-3.5 rounded-full bg-brand-primary transition-all duration-200"></div>
<!-- Dot 2 Filled -->
<div class="w-3.5 h-3.5 rounded-full bg-brand-primary transition-all duration-200"></div>
<!-- Dot 3 Filled -->
<div class="w-3.5 h-3.5 rounded-full bg-brand-primary transition-all duration-200"></div>
<!-- Dot 4 Filled -->
<div class="w-3.5 h-3.5 rounded-full bg-brand-primary transition-all duration-200"></div>
<!-- Dot 5 Active Input (Pulsing ring) -->
<div class="w-3.5 h-3.5 rounded-full bg-bg-sunken relative flex items-center justify-center">
<span class="w-2 h-2 rounded-full bg-border-strong animate-pulse"></span>
</div>
<!-- Dot 6 Pending -->
<div class="w-3.5 h-3.5 rounded-full bg-bg-sunken"></div>
</div>
<!-- Biometric Trigger Prompt -->
<button class="flex items-center justify-center gap-2 px-4 py-2.5 rounded-full bg-brand-subtle active:bg-brand-primary/15 transition-colors focus:outline-none" id="biometric-trigger" type="button">
<span class="material-symbols-outlined text-[20px] text-brand-primary">fingerprint</span>
<span class="font-label-md text-label-md text-brand-primary font-semibold">Gunakan Sidik Jari / Face ID</span>
</button>
</div>
<!-- Numeric Touch Keypad (Rule-compliant 48dp+ targets, Sunken Flat Design) -->
<div class="px-space-lg pb-3 pt-1">
<div class="grid grid-cols-3 gap-y-2 gap-x-4 max-w-[340px] mx-auto">
<!-- 1 -->
<button class="keypad-btn h-14 w-full flex items-center justify-center rounded-xl bg-bg-canvas active:bg-bg-sunken text-text-primary font-headline-md text-headline-md focus:outline-none transition-transform active:scale-95" type="button">
        1
      </button>
<!-- 2 -->
<button class="keypad-btn h-14 w-full flex items-center justify-center rounded-xl bg-bg-canvas active:bg-bg-sunken text-text-primary font-headline-md text-headline-md focus:outline-none transition-transform active:scale-95" type="button">
        2
      </button>
<!-- 3 -->
<button class="keypad-btn h-14 w-full flex items-center justify-center rounded-xl bg-bg-canvas active:bg-bg-sunken text-text-primary font-headline-md text-headline-md focus:outline-none transition-transform active:scale-95" type="button">
        3
      </button>
<!-- 4 -->
<button class="keypad-btn h-14 w-full flex items-center justify-center rounded-xl bg-bg-canvas active:bg-bg-sunken text-text-primary font-headline-md text-headline-md focus:outline-none transition-transform active:scale-95" type="button">
        4
      </button>
<!-- 5 -->
<button class="keypad-btn h-14 w-full flex items-center justify-center rounded-xl bg-bg-canvas active:bg-bg-sunken text-text-primary font-headline-md text-headline-md focus:outline-none transition-transform active:scale-95" type="button">
        5
      </button>
<!-- 6 -->
<button class="keypad-btn h-14 w-full flex items-center justify-center rounded-xl bg-bg-canvas active:bg-bg-sunken text-text-primary font-headline-md text-headline-md focus:outline-none transition-transform active:scale-95" type="button">
        6
      </button>
<!-- 7 -->
<button class="keypad-btn h-14 w-full flex items-center justify-center rounded-xl bg-bg-canvas active:bg-bg-sunken text-text-primary font-headline-md text-headline-md focus:outline-none transition-transform active:scale-95" type="button">
        7
      </button>
<!-- 8 -->
<button class="keypad-btn h-14 w-full flex items-center justify-center rounded-xl bg-bg-canvas active:bg-bg-sunken text-text-primary font-headline-md text-headline-md focus:outline-none transition-transform active:scale-95" type="button">
        8
      </button>
<!-- 9 -->
<button class="keypad-btn h-14 w-full flex items-center justify-center rounded-xl bg-bg-canvas active:bg-bg-sunken text-text-primary font-headline-md text-headline-md focus:outline-none transition-transform active:scale-95" type="button">
        9
      </button>
<!-- Biometric Instant Shortcut (Bottom-Left) -->
<button aria-label="Otentikasi Wajah" class="h-14 w-full flex items-center justify-center rounded-xl active:bg-bg-sunken text-brand-primary focus:outline-none transition-transform active:scale-95" type="button">
<span class="material-symbols-outlined text-[28px]">face</span>
</button>
<!-- 0 -->
<button class="keypad-btn h-14 w-full flex items-center justify-center rounded-xl bg-bg-canvas active:bg-bg-sunken text-text-primary font-headline-md text-headline-md focus:outline-none transition-transform active:scale-95" type="button">
        0
      </button>
<!-- Backspace (Bottom-Right) -->
<button aria-label="Hapus Digit" class="h-14 w-full flex items-center justify-center rounded-xl active:bg-bg-sunken text-text-secondary focus:outline-none transition-transform active:scale-95" id="backspace-btn" type="button">
<span class="material-symbols-outlined text-[26px]">backspace</span>
</button>
</div>
</div>
<!-- Trust Guarantee & Security Microcopy -->
<div class="flex flex-col items-center px-space-lg pt-1 pb-6 gap-2">
<button class="font-label-md text-label-md text-brand-primary font-semibold hover:underline active:opacity-80 py-1" type="button">
      Lupa PIN Wallet? Reset di sini
    </button>
<div class="flex items-center gap-1.5 text-text-tertiary">
<span class="material-symbols-outlined text-[15px] text-success" style="font-variation-settings: 'FILL' 1;">lock</span>
<span class="font-caption text-caption text-text-tertiary">Transaksi diproteksi enkripsi 256-bit Xpedia Secure+</span>
</div>
</div>
</div>
<script>
  (function() {
    const dotsContainer = document.getElementById('pin-dots-container');
    let enteredLength = 4;
    const maxDigits = 6;

    function renderDots() {
      if (!dotsContainer) return;
      dotsContainer.innerHTML = '';
      for (let i = 0; i < maxDigits; i++) {
        const dot = document.createElement('div');
        if (i < enteredLength) {
          dot.className = 'w-3.5 h-3.5 rounded-full bg-brand-primary transition-all duration-200 scale-105';
        } else if (i === enteredLength) {
          dot.className = 'w-3.5 h-3.5 rounded-full bg-bg-sunken relative flex items-center justify-center transition-all duration-200';
          const pulse = document.createElement('span');
          pulse.className = 'w-2 h-2 rounded-full bg-border-strong animate-pulse';
          dot.appendChild(pulse);
        } else {
          dot.className = 'w-3.5 h-3.5 rounded-full bg-bg-sunken transition-all duration-200';
        }
        dotsContainer.appendChild(dot);
      }
    }

    document.querySelectorAll('.keypad-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (enteredLength < maxDigits) {
          enteredLength++;
          renderDots();
        }
      });
    });

    const backspaceBtn = document.getElementById('backspace-btn');
    if (backspaceBtn) {
      backspaceBtn.addEventListener('click', () => {
        if (enteredLength > 0) {
          enteredLength--;
          renderDots();
        }
      });
    }

    const bioBtn = document.getElementById('biometric-trigger');
    if (bioBtn) {
      bioBtn.addEventListener('click', () => {
        enteredLength = maxDigits;
        renderDots();
      });
    }
  })();
</script></main></body></html>
