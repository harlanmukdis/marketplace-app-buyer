<!-- Bundle 1: Standard (Selected) -->

<!-- Primary Purchase Button with Computed Total Amount (52px height) -->
<button class="h-[52px] flex-1 rounded-lg bg-brand-primary text-text-on-brand flex items-center justify-center gap-2 font-headline-md text-headline-md shadow-md active:bg-brand-primary-pressed transition-all active:scale-[0.99]" id="btn-buy-now" type="button">
<span>Beli Sekarang</span>
<span class="opacity-60">•</span>
<span class="font-price-md text-price-md" id="cta-total-price">Rp 1.399.000</span>
</button>
</div>

<script>
  (() => {
    // Pricing state & configuration
    const BASE_PRICE = 1399000;
    const MAX_STOCK = 5;
    let selectedColor = 'Hitam';
    let selectedBundle = 'Standard';
    let bundleExtra = 0;
    let currentQty = 1;

    // Element bindings
    const priceDisplay = document.getElementById('product-price');
    const ctaPriceDisplay = document.getElementById('cta-total-price');
    const summaryLabel = document.getElementById('selected-summary');
    const qtyDisplay = document.getElementById('qty-display');
    const minusBtn = document.getElementById('btn-qty-minus');
    const plusBtn = document.getElementById('btn-qty-plus');
    const colorButtons = document.querySelectorAll('#color-group .variant-btn');
    const bundleButtons = document.querySelectorAll('#bundle-group .bundle-btn');
    const closeBtn = document.getElementById('btn-close-sheet');
    const buyBtn = document.getElementById('btn-buy-now');
    const cartBtn = document.getElementById('btn-add-cart');

    function formatRupiah(num) {
      return 'Rp ' + num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }

    function updateTotal() {
      const singleUnitPrice = BASE_PRICE + bundleExtra;
      const grandTotal = singleUnitPrice * currentQty;

      priceDisplay.textContent = formatRupiah(singleUnitPrice);
      ctaPriceDisplay.textContent = formatRupiah(grandTotal);
      summaryLabel.textContent = `${selectedColor}, ${selectedBundle}`;
      qtyDisplay.textContent = currentQty;

      minusBtn.disabled = currentQty <= 1;
      plusBtn.disabled = currentQty >= MAX_STOCK;
    }

    // Color Selector Micro-Interactions
    colorButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        colorButtons.forEach((b) => {
          b.setAttribute('aria-checked', 'false');
          b.classList.remove('bg-brand-subtle', 'text-brand-primary', 'shadow-sm');
          b.classList.add('bg-bg-sunken', 'text-text-secondary');
          const tick = b.querySelector('.checkmark');
          if (tick) tick.classList.add('hidden');
        });

        btn.setAttribute('aria-checked', 'true');
        btn.classList.add('bg-brand-subtle', 'text-brand-primary', 'shadow-sm');
        btn.classList.remove('bg-bg-sunken', 'text-text-secondary');
        const activeTick = btn.querySelector('.checkmark');
        if (activeTick) activeTick.classList.remove('hidden');

        selectedColor = btn.dataset.name;
        updateTotal();
      });
    });

    // Bundle Selector Micro-Interactions
    bundleButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        bundleButtons.forEach((b) => {
          b.setAttribute('aria-checked', 'false');
          b.classList.remove('bg-brand-subtle', 'text-brand-primary');
          b.classList.add('bg-bg-sunken', 'text-text-secondary');
          const radioIcon = b.querySelector('.checkmark');
          if (radioIcon) {
            radioIcon.textContent = 'radio_button_unchecked';
            radioIcon.classList.remove('text-brand-primary');
            radioIcon.classList.add('text-text-tertiary');
          }
        });

        btn.setAttribute('aria-checked', 'true');
        btn.classList.add('bg-brand-subtle', 'text-brand-primary');
        btn.classList.remove('bg-bg-sunken', 'text-text-secondary');
        const activeRadio = btn.querySelector('.checkmark');
        if (activeRadio) {
          activeRadio.textContent = 'radio_button_checked';
          activeRadio.classList.add('text-brand-primary');
          activeRadio.classList.remove('text-text-tertiary');
        }

        selectedBundle = btn.dataset.name;
        bundleExtra = parseInt(btn.dataset.extra || '0', 10);
        updateTotal();
      });
    });

    // Stepper Handlers
    plusBtn.addEventListener('click', () => {
      if (currentQty < MAX_STOCK) {
        currentQty++;
        updateTotal();
      }
    });

    minusBtn.addEventListener('click', () => {
      if (currentQty > 1) {
        currentQty--;
        updateTotal();
      }
    });

    // Tactile Feedback for CTAs
    closeBtn.addEventListener('click', () => {
      const parentCard = closeBtn.closest('main');
      if (parentCard) {
        parentCard.style.transition = 'transform 0.25s ease-in, opacity 0.2s';
        parentCard.style.transform = 'translateY(100%)';
        parentCard.style.opacity = '0';
      }
    });

    cartBtn.addEventListener('click', () => {
      cartBtn.classList.add('scale-90');
      setTimeout(() => cartBtn.classList.remove('scale-90'), 150);
      const icon = cartBtn.querySelector('.material-symbols-outlined');
      if (icon) {
        icon.textContent = 'check_circle';
        setTimeout(() => (icon.textContent = 'add_shopping_cart'), 1200);
      }
    });

    buyBtn.addEventListener('click', () => {
      buyBtn.classList.add('scale-95');
      setTimeout(() => buyBtn.classList.remove('scale-95'), 120);
    });

    // Initial calculation run
    updateTotal();
  })();
</script></main></body></html>
